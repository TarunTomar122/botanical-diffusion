# Baseline: 35M UNet at 128px, from-scratch, Curtis 3.5k
model:
  sample_size: 128
  in_channels: 3
  out_channels: 3
  layers_per_block: 2
  block_out_channels: [128, 128, 256, 256, 512, 512]
  down_block_types: ["DownBlock2D", "DownBlock2D", "DownBlock2D", "DownBlock2D", "AttnDownBlock2D", "DownBlock2D"]
  up_block_types: ["UpBlock2D", "AttnUpBlock2D", "UpBlock2D", "UpBlock2D", "UpBlock2D", "UpBlock2D"]
  dropout: 0.1
  attention_head_dim: 8
  norm_num_groups: 32

diffusion:
  num_train_timesteps: 1000
  beta_schedule: "linear"
  prediction_type: "epsilon"

training:
  resolution: 128
  center_crop: true
  random_flip: true
  train_batch_size: 8
  gradient_accumulation_steps: 4  # effective 32
  num_epochs: 1200  # ~400k steps on 5k
  learning_rate: 1.0e-4
  lr_warmup_steps: 2000
  lr_scheduler: "cosine"
  adam_beta1: 0.95
  adam_beta2: 0.999
  adam_weight_decay: 1.0e-6
  adam_epsilon: 1.0e-8
  ema_inv_gamma: 1.0
  ema_power: 0.75
  ema_max_decay: 0.9999
  use_ema: true
  mixed_precision: "fp16"
  enable_xformers: true
  dataloader_num_workers: 4
  checkpointing_steps: 10000
  save_images_epochs: 10
  save_model_epochs: 20
  max_train_steps: 800000
  seed: 42

data:
  train_data_dir: "data/processed/curtis-128"
  dataset_name: null
  cache: false

output:
  output_dir: "experiments/exp001_baseline_128"
  logging_dir: "logs"
  push_to_hub: false
